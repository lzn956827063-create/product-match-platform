groups:
  - name: product-match
    rules:
      - alert: ProductMatchPostgreSQLUnavailable
        expr: pg_up == 0
        for: 30s
        annotations:
          summary: PostgreSQL 连续 30 秒不可用；停止发布并按数据库中断手册处理
      - alert: ProductMatchPostgreSQLConnectionsHigh
        expr: sum(pg_stat_database_numbackends{datname="productmatch"}) / max(pg_settings_max_connections) > 0.8
        for: 5m
        annotations:
          summary: PostgreSQL 连接使用率超过 80%；检查连接池、长事务和等待事件
      - alert: ProductMatchPostgreSQLDeadlock
        expr: increase(pg_stat_database_deadlocks{datname="productmatch"}[10m]) > 0
        for: 0m
        annotations:
          summary: PostgreSQL 检测到死锁；按请求编号和锁等待证据定位事务
      - alert: ProductMatchOutboxDelayed
        expr: product_match_outbox_oldest_seconds > 300
        for: 2m
        annotations:
          summary: 后台事件超过 5 分钟未完成；检查 dispatcher、Redis 和 Worker
      - alert: ProductMatchHttpFailures
        expr: sum(increase(product_match_http_seconds_count{status=~"5.."}[10m])) / sum(increase(product_match_http_seconds_count[10m])) > 0.05 and sum(increase(product_match_http_seconds_count[10m])) >= 100
        for: 2m
        annotations:
          summary: 10 分钟内至少 100 次请求且服务端错误率超过 5%
      - alert: ProductMatchExpiredLeases
        expr: product_match_expired_leases > 0
        for: 3m
        annotations:
          summary: 租约过期持续 3 分钟；检查 Worker 和数据库连接
      - alert: ProductMatchReleaseFilesFailed
        expr: sum(product_match_release_artifacts{status="FAILED"}) > 0
        for: 2m
        annotations:
          summary: 发布文件生成失败；在发布中心按 release_id 重试并核对对象哈希
      - alert: ProductMatchDeliveryNeedsAttention
        expr: sum(product_match_deliveries{status=~"MANUAL|PARTIAL|REJECTED|RECONCILE"}) > 0
        for: 5m
        annotations:
          summary: 交付需要人工处理；按 delivery_id 查看尝试及回执，先对账再重放
      - alert: ProductMatchDiskLow
        expr: min(product_match_disk_free_bytes) < 1073741824
        for: 5m
        annotations:
          summary: 可用磁盘不足 1 GiB；检查对象保留与备份目录
      - alert: ProductMatchListLatency
        expr: histogram_quantile(0.95, sum by(le) (rate(product_match_http_seconds_bucket{route="/api/v1/runs/{ident}/items"}[10m]))) > 0.5 and sum(increase(product_match_http_seconds_count{route="/api/v1/runs/{ident}/items"}[10m])) >= 100
        for: 5m
        annotations:
          summary: 至少 100 个列表样本的 P95 超过 500ms；检查实例、数据库连接和锁等待

      - alert: ProductMatchReceiptOverdue
        expr: product_match_receipt_overdue > 0
        for: 30s
        annotations:
          summary: 业务回执超时；集成负责人在统一待办核对对端版本及摘要，禁止直接标记成功
      - alert: ProductMatchReleaseFilesOverdue
        expr: product_match_release_files_overdue > 0
        for: 2m
        annotations:
          summary: 发布文件超过 24 小时未就绪；发布者检查对象存储与文件任务
      - alert: ProductMatchImpactUnresolved
        expr: product_match_impacts_open > 0
        for: 24h
        annotations:
          summary: 标准库影响持续未关闭；主管分派记录复核或发布处置
      - alert: ProductMatchNeedsInfoOverdue
        expr: product_match_needs_info_overdue > 0
        for: 5m
        annotations:
          summary: 待补资料超过 24 小时；数据专员催收并导入回填模板
      - alert: ProductMatchReceiptOwnerMissing
        expr: product_match_receipt_owner_missing > 0
        for: 10m
        annotations:
          summary: 已启用接收端尚未指定回执对账负责人
