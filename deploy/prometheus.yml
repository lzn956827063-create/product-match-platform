global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: product-match-api
    metrics_path: /api/v1/internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['api:8000']
  - job_name: product-match-workers
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['worker:9200', 'worker:9201', 'worker-short:9200', 'dispatcher:9200']
