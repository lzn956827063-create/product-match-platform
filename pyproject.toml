[project]
name = "product-match"
version = "1.1.0"
description = "商品数据匹配与核对平台"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "celery>=5.4,<6", "redis>=5,<7", "boto3>=1.35,<2", "openpyxl>=3.1,<4", "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5", "rapidfuzz>=3.9,<4", "python-multipart>=0.0.20", "PyJWT>=2.9,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "workers*", "ml*"]
