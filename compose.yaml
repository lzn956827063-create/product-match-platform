name: product-match
x-backend: &backend
  build:
    context: .
    dockerfile: deploy/Dockerfile.api
  environment: &environment
    DATABASE_URL: postgresql+psycopg://productmatch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/productmatch
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    DATA_DIR: /data
    QUEUE_MODE: celery
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: s3
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    S3_BUCKET: product-match
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    CODE_VERSION: 1.0.0
  volumes:
    - app-data:/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productmatch
      POSTGRES_USER: productmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U productmatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes: [object-data:/data]
    restart: unless-stopped
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    entrypoint: [/bin/sh, -c]
    command:
      - 'until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done; mc mb --ignore-existing local/product-match'
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 4s
      retries: 15
  worker:
    <<: *backend
    command: [celery, -A, workers.tasks:app, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  dispatcher:
    <<: *backend
    command: [python, -m, workers.dispatcher]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports: ['${WEB_PORT:-8080}:80']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-data:
  app-data:
