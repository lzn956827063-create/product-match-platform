name: product-match

x-runtime-environment: &runtime-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: productmatch
  DB_USER: productmatch_app
  DB_PASSWORD_FILE: /run/secrets/db_app_password
  DB_POOL_SIZE: 5
  DB_MAX_OVERFLOW: 0
  DB_POOL_TIMEOUT_SECONDS: 5
  DB_STATEMENT_TIMEOUT_MS: 30000
  DB_LOCK_TIMEOUT_MS: 5000
  DB_IDLE_TRANSACTION_TIMEOUT_MS: 60000
  DB_APPLICATION_NAME: product-match
  JWT_SECRET_FILE: /run/secrets/jwt_secret
  DATA_DIR: /data
  QUEUE_MODE: celery
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-productmatch-app}
  S3_SECRET_KEY_FILE: /run/secrets/s3_app_secret
  S3_BUCKET: product-match
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CODE_VERSION: 1.3.1
  DB_AUTO_CREATE: 'false'
  METRICS_TOKEN_FILE: /run/secrets/metrics_token
  WORKER_METRICS_PORT: 9200
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  WEBHOOK_ALLOW_LOOPBACK: 'false'
  INTEGRATION_MASTER_KEY_FILE: /run/secrets/integration_master_key

x-runtime-secrets: &runtime-secrets
  - db_app_password
  - jwt_secret
  - s3_app_secret
  - metrics_token
  - integration_master_key

x-backend: &backend
  build:
    context: .
    dockerfile: deploy/Dockerfile.api
  environment: *runtime-environment
  secrets: *runtime-secrets
  volumes:
    - app-data:/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    environment:
      POSTGRES_DB: productmatch
      POSTGRES_USER: productmatch_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
    secrets:
      - db_bootstrap_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U productmatch_bootstrap -d productmatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-role-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: productmatch
      PGUSER: productmatch_bootstrap
      PG_BOOTSTRAP_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      DB_OWNER_PASSWORD_FILE: /run/secrets/db_owner_password
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      DB_READONLY_PASSWORD_FILE: /run/secrets/db_readonly_password
      DB_BACKUP_PASSWORD_FILE: /run/secrets/db_backup_password
    secrets:
      - db_bootstrap_password
      - db_owner_password
      - db_app_password
      - db_readonly_password
      - db_backup_password
    volumes:
      - ./deploy/postgres/ensure-roles.sh:/usr/local/bin/ensure-roles:ro
    command: [/bin/sh, /usr/local/bin/ensure-roles]
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_ACCESS_KEY:-productmatch-root}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_root_secret
    secrets:
      - s3_root_secret
    volumes:
      - object-data:/data
    restart: unless-stopped

  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_started}
    environment:
      S3_ROOT_ACCESS_KEY: ${S3_ROOT_ACCESS_KEY:-productmatch-root}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-productmatch-app}
      S3_ROOT_SECRET_FILE: /run/secrets/s3_root_secret
      S3_APP_SECRET_FILE: /run/secrets/s3_app_secret
    secrets:
      - s3_root_secret
      - s3_app_secret
    volumes:
      - ./deploy/minio/app-policy.json:/config/app-policy.json:ro
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        export S3_ROOT_SECRET="$$(cat "$$S3_ROOT_SECRET_FILE")";
        export S3_APP_SECRET="$$(cat "$$S3_APP_SECRET_FILE")";
        until mc alias set local http://minio:9000 "$$S3_ROOT_ACCESS_KEY" "$$S3_ROOT_SECRET"; do sleep 2; done;
        mc mb --ignore-existing local/product-match;
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_APP_SECRET" || mc admin user enable local "$$S3_ACCESS_KEY";
        mc admin policy create local product-match-app /config/app-policy.json || true;
        mc admin policy attach local product-match-app --user "$$S3_ACCESS_KEY"

  migrate:
    <<: *backend
    environment:
      <<: *runtime-environment
      DB_USER: productmatch_owner
      DB_PASSWORD_FILE: /run/secrets/db_owner_password
      DB_APPLICATION_NAME: product-match-migrate
      DB_POOL_SIZE: 1
      DB_STATEMENT_TIMEOUT_MS: 0
    secrets:
      - db_owner_password
      - jwt_secret
      - s3_app_secret
      - metrics_token
      - integration_master_key
    command: [alembic, upgrade, head]
    depends_on:
      db-role-init: {condition: service_completed_successfully}
    restart: 'no'

  api:
    <<: *backend
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: product-match-api
      DB_POOL_SIZE: 8
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readiness')"]
      interval: 10s
      timeout: 4s
      retries: 15

  worker:
    <<: *backend
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: product-match-worker
      DB_POOL_SIZE: 3
    command: [celery, -A, "workers.tasks:app", worker, --loglevel=INFO, --concurrency=2, -Q, match]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}

  worker-short:
    <<: *backend
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: product-match-worker-short
      DB_POOL_SIZE: 2
    command: [celery, -A, "workers.tasks:app", worker, --loglevel=INFO, --concurrency=1, -Q, short]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}

  dispatcher:
    <<: *backend
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: product-match-dispatcher
      DB_POOL_SIZE: 2
    command: [python, -m, workers.dispatcher]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports: ['${WEB_PORT:-8080}:80']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-data:
  app-data:

secrets:
  db_bootstrap_password:
    file: ${SECRETS_DIR:-./var/secrets}/db_bootstrap_password
  db_owner_password:
    file: ${SECRETS_DIR:-./var/secrets}/db_owner_password
  db_app_password:
    file: ${SECRETS_DIR:-./var/secrets}/db_app_password
  db_readonly_password:
    file: ${SECRETS_DIR:-./var/secrets}/db_readonly_password
  db_backup_password:
    file: ${SECRETS_DIR:-./var/secrets}/db_backup_password
  jwt_secret:
    file: ${SECRETS_DIR:-./var/secrets}/jwt_secret
  s3_root_secret:
    file: ${SECRETS_DIR:-./var/secrets}/s3_root_secret
  s3_app_secret:
    file: ${SECRETS_DIR:-./var/secrets}/s3_app_secret
  metrics_token:
    file: ${SECRETS_DIR:-./var/secrets}/metrics_token
  integration_master_key:
    file: ${SECRETS_DIR:-./var/secrets}/integration_master_key
